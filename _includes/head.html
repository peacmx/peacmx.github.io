<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">


    <!-- Custom CSS & Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link rel="stylesheet" href="{{ "/style.css"}}">

    <!-- Custom Fonts -->
    <link rel="stylesheet" href="{{ "/css/font-awesome/css/font-awesome.min.css" }}">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Alegreya+Sans' rel='stylesheet' type='text/css'>
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700' rel='stylesheet' type='text/css'>
    <style>
header.blog-header {
    padding-top: 140px;
    padding-bottom: 60px;
    background-size: cover;
    background-position: center;
    background-color: #999;
    background-blend-mode: multiply;
}
header.blog-header .intro-text .intro-heading {
    font-size: 36px;
    line-height: 40px;
    margin-bottom: 0;
}
@media (min-width: 768px) {
    header.blog-header {
        padding-top: 180px;
        padding-bottom: 90px;
    }
    header.blog-header .intro-text .intro-heading {
        font-size: 50px;
        line-height: 54px;
    }
}
header.blog-header .post-meta {
    font-size: 16px;
    margin: 18px 0 10px;
}
header.blog-header .post-tags {
    margin: 0 0 8px;
}
header.blog-header .post-tags .label {
    font-size: 13px;
    padding: 5px 10px;
    margin: 0 3px;
}
header.blog-header .post-keywords {
    font-size: 14px;
    font-style: italic;
    margin: 0;
}
header.blog-header .post-meta,
header.blog-header .post-keywords {
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
}
</style>
 {% if page.collection == 'posts' %}
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}">
<meta property="og:url" content="https://peacmx.github.io{{ page.url }}">
{% if page.image %}<meta property="og:image" content="https://peacmx.github.io{{ page.image }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
{% endif %}
</head>
